<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Efron's Dice{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/casino.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body class="casino-bg {% block body_class %}{% endblock %}">
    <div class="casino-overlay"></div>
    <header class="site-header">
      <span class="logo">♠ Efron's Dice ♦</span>
      <nav class="nav">
        <a href="{{ url_for('dice') }}" class="nav-link {% if active == 'dice' %}active{% endif %}">Dice</a>
        <a href="{{ url_for('machine_day') }}" class="nav-link {% if active == 'machine' %}active{% endif %}">Machine</a>
      </nav>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
